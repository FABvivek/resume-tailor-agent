services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_tailor_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text}
      - DATABASE_URL=sqlite:///./resume_tailor.db
      - UPLOAD_DIR=/app/uploads
      - MAX_STEPS=8
      - MAX_SESSION_TOKENS=16000
      - ENABLE_LLM_VERIFIER=false
    volumes:
      - db_data:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_tailor_ui
    command: streamlit run ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
